  <text x="99" y="222" fill="#e8eaed" font-size="17" text-anchor="middle" font-weight="600">GENERIC</text>
  <text x="196" y="214" fill="#e8eaed" font-size="14">нужно всем</text>
  <text x="196" y="234" fill="#9aa7b8" font-size="13">купить / no-code</text>
</svg>
