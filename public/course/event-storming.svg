<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="es-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa7b8"/>
    </marker>
  </defs>

  <text x="20" y="28" fill="#9aa7b8" font-size="13">Event Storming — лента поведения</text>

  <!-- Команда -->
  <rect x="24" y="60" width="160" height="76" rx="10" fill="rgba(59,130,246,0.18)" stroke="#3b82f6" stroke-width="2"/>
  <text x="104" y="94" fill="#e8eaed" font-size="17" text-anchor="middle">Команда</text>
  <text x="104" y="116" fill="#9aa7b8" font-size="13" text-anchor="middle">Checkout</text>

  <!-- Событие -->
  <rect x="240" y="60" width="160" height="76" rx="10" fill="rgba(245,158,11,0.18)" stroke="#f59e0b" stroke-width="2"/>
  <text x="320" y="94" fill="#e8eaed" font-size="17" text-anchor="middle">Событие</text>
  <text x="320" y="116" fill="#9aa7b8" font-size="13" text-anchor="middle">Order placed</text>

  <!-- Агрегат -->
  <rect x="456" y="60" width="160" height="76" rx="10" fill="rgba(234,179,8,0.18)" stroke="#eab308" stroke-width="2"/>
  <text x="536" y="94" fill="#e8eaed" font-size="17" text-anchor="middle">Агрегат</text>
  <text x="536" y="116" fill="#9aa7b8" font-size="13" text-anchor="middle">Order</text>

  <!-- Стрелки -->
  <line x1="188" y1="98" x2="234" y2="98" stroke="#9aa7b8" stroke-width="2" marker-end="url(#es-arrow)"/>
  <line x1="404" y1="98" x2="450" y2="98" stroke="#9aa7b8" stroke-width="2" marker-end="url(#es-arrow)"/>

  <text x="320" y="182" fill="#9aa7b8" font-size="13" text-anchor="middle">поведение системы: команда вызывает событие,</text>
  <text x="320" y="200" fill="#9aa7b8" font-size="13" text-anchor="middle">событие меняет агрегат</text>
</svg>
