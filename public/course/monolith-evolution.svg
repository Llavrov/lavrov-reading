<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="me-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa7b8"/>
    </marker>
    <marker id="me-arrow-s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8ba3c7"/>
    </marker>
  </defs>

  <text x="20" y="28" fill="#9aa7b8" font-size="13">Эволюция монолита</text>

  <!-- 1. Монолит -->
  <rect x="20" y="60" width="150" height="118" rx="10" fill="rgba(59,130,246,0.18)" stroke="#3b82f6" stroke-width="2"/>
  <text x="95" y="124" fill="#e8eaed" font-size="16" text-anchor="middle">Монолит</text>
  <text x="95" y="200" fill="#9aa7b8" font-size="13" text-anchor="middle">один блок</text>

  <line x1="176" y1="119" x2="212" y2="119" stroke="#9aa7b8" stroke-width="2" marker-end="url(#me-arrow)"/>

  <!-- 2. Распределённый монолит -->
  <rect x="218" y="60" width="204" height="118" rx="10" fill="rgba(239,68,68,0.16)" stroke="#ef4444" stroke-width="2"/>
  <rect x="238" y="80" width="54" height="34" rx="7" fill="rgba(148,163,184,0.15)" stroke="#9aa7b8" stroke-width="1.5"/>
  <rect x="348" y="80" width="54" height="34" rx="7" fill="rgba(148,163,184,0.15)" stroke="#9aa7b8" stroke-width="1.5"/>
  <rect x="238" y="128" width="54" height="34" rx="7" fill="rgba(148,163,184,0.15)" stroke="#9aa7b8" stroke-width="1.5"/>
  <rect x="348" y="128" width="54" height="34" rx="7" fill="rgba(148,163,184,0.15)" stroke="#9aa7b8" stroke-width="1.5"/>
  <line x1="292" y1="94" x2="348" y2="96" stroke="#8ba3c7" stroke-width="1.5" marker-end="url(#me-arrow-s)"/>
  <line x1="348" y1="110" x2="292" y2="130" stroke="#8ba3c7" stroke-width="1.5" marker-end="url(#me-arrow-s)"/>
  <line x1="265" y1="114" x2="265" y2="126" stroke="#8ba3c7" stroke-width="1.5" marker-end="url(#me-arrow-s)"/>
  <line x1="375" y1="114" x2="375" y2="126" stroke="#8ba3c7" stroke-width="1.5" marker-end="url(#me-arrow-s)"/>
  <line x1="292" y1="145" x2="348" y2="145" stroke="#8ba3c7" stroke-width="1.5" marker-end="url(#me-arrow-s)"/>
  <line x1="292" y1="140" x2="345" y2="90" stroke="#8ba3c7" stroke-width="1.5" marker-end="url(#me-arrow-s)"/>
  <text x="320" y="200" fill="#ef4444" font-size="13" text-anchor="middle">так НЕ надо</text>

  <line x1="428" y1="119" x2="464" y2="119" stroke="#9aa7b8" stroke-width="2" marker-end="url(#me-arrow)"/>

  <!-- 3. Модульный монолит / сервисы -->
  <rect x="470" y="60" width="150" height="118" rx="10" fill="rgba(34,197,94,0.18)" stroke="#22c55e" stroke-width="2"/>
  <rect x="488" y="80" width="52" height="34" rx="7" fill="rgba(148,163,184,0.15)" stroke="#9aa7b8" stroke-width="1.5"/>
  <rect x="550" y="80" width="52" height="34" rx="7" fill="rgba(148,163,184,0.15)" stroke="#9aa7b8" stroke-width="1.5"/>
  <rect x="519" y="128" width="52" height="34" rx="7" fill="rgba(148,163,184,0.15)" stroke="#9aa7b8" stroke-width="1.5"/>
  <line x1="540" y1="97" x2="550" y2="97" stroke="#8ba3c7" stroke-width="1.5" marker-end="url(#me-arrow-s)"/>
  <line x1="524" y1="114" x2="540" y2="126" stroke="#8ba3c7" stroke-width="1.5" marker-end="url(#me-arrow-s)"/>
  <text x="545" y="200" fill="#22c55e" font-size="13" text-anchor="middle">так надо</text>
</svg>
