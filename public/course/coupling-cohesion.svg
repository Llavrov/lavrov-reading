<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="cc-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8ba3c7"/>
    </marker>
  </defs>

  <text x="20" y="28" fill="#9aa7b8" font-size="13">Связанность: coupling вниз, cohesion вверх</text>

  <!-- LEFT: Плохо -->
  <rect x="16" y="44" width="296" height="216" rx="10" fill="rgba(239,68,68,0.16)" stroke="#ef4444" stroke-width="2"/>
  <text x="164" y="68" fill="#e8eaed" font-size="15" text-anchor="middle" font-weight="600">Плохо</text>

  <!-- spaghetti blocks -->
  <rect x="52" y="90" width="72" height="40" rx="8" fill="rgba(148,163,184,0.15)" stroke="#9aa7b8" stroke-width="1.5"/>
  <rect x="204" y="92" width="72" height="40" rx="8" fill="rgba(148,163,184,0.15)" stroke="#9aa7b8" stroke-width="1.5"/>
  <rect x="48" y="180" width="72" height="40" rx="8" fill="rgba(148,163,184,0.15)" stroke="#9aa7b8" stroke-width="1.5"/>
  <rect x="208" y="182" width="72" height="40" rx="8" fill="rgba(148,163,184,0.15)" stroke="#9aa7b8" stroke-width="1.5"/>
  <rect x="128" y="136" width="72" height="40" rx="8" fill="rgba(148,163,184,0.15)" stroke="#9aa7b8" stroke-width="1.5"/>

  <line x1="124" y1="110" x2="204" y2="112" stroke="#8ba3c7" stroke-width="1.5" marker-end="url(#cc-arrow)"/>
  <line x1="124" y1="118" x2="128" y2="150" stroke="#8ba3c7" stroke-width="1.5" marker-end="url(#cc-arrow)"/>
  <line x1="240" y1="132" x2="196" y2="160" stroke="#8ba3c7" stroke-width="1.5" marker-end="url(#cc-arrow)"/>
  <line x1="84" y1="180" x2="140" y2="176" stroke="#8ba3c7" stroke-width="1.5" marker-end="url(#cc-arrow)"/>
  <line x1="188" y1="176" x2="228" y2="182" stroke="#8ba3c7" stroke-width="1.5" marker-end="url(#cc-arrow)"/>
  <line x1="120" y1="200" x2="208" y2="202" stroke="#8ba3c7" stroke-width="1.5" marker-end="url(#cc-arrow)"/>
  <line x1="88" y1="130" x2="84" y2="180" stroke="#8ba3c7" stroke-width="1.5" marker-end="url(#cc-arrow)"/>
  <line x1="244" y1="132" x2="244" y2="182" stroke="#8ba3c7" stroke-width="1.5" marker-end="url(#cc-arrow)"/>

  <text x="164" y="248" fill="#9aa7b8" font-size="13" text-anchor="middle">высокий coupling</text>

  <!-- RIGHT: Хорошо -->
  <rect x="328" y="44" width="296" height="216" rx="10" fill="rgba(34,197,94,0.18)" stroke="#22c55e" stroke-width="2"/>
  <text x="476" y="68" fill="#e8eaed" font-size="15" text-anchor="middle" font-weight="600">Хорошо</text>

  <!-- module A -->
  <rect x="352" y="86" width="112" height="130" rx="10" fill="rgba(59,130,246,0.14)" stroke="#8ba3c7" stroke-width="1.5"/>
  <rect x="366" y="102" width="84" height="30" rx="6" fill="rgba(148,163,184,0.18)" stroke="#9aa7b8" stroke-width="1.5"/>
  <rect x="366" y="168" width="84" height="30" rx="6" fill="rgba(148,163,184,0.18)" stroke="#9aa7b8" stroke-width="1.5"/>
  <line x1="408" y1="132" x2="408" y2="166" stroke="#8ba3c7" stroke-width="1.5" marker-end="url(#cc-arrow)"/>

  <!-- module B -->
  <rect x="488" y="86" width="112" height="130" rx="10" fill="rgba(59,130,246,0.14)" stroke="#8ba3c7" stroke-width="1.5"/>
  <rect x="502" y="102" width="84" height="30" rx="6" fill="rgba(148,163,184,0.18)" stroke="#9aa7b8" stroke-width="1.5"/>
  <rect x="502" y="168" width="84" height="30" rx="6" fill="rgba(148,163,184,0.18)" stroke="#9aa7b8" stroke-width="1.5"/>
  <line x1="544" y1="132" x2="544" y2="166" stroke="#8ba3c7" stroke-width="1.5" marker-end="url(#cc-arrow)"/>

  <!-- single link between modules -->
  <line x1="464" y1="151" x2="488" y2="151" stroke="#8ba3c7" stroke-width="1.5" marker-end="url(#cc-arrow)"/>

  <text x="476" y="248" fill="#9aa7b8" font-size="13" text-anchor="middle">низкий coupling, высокий cohesion</text>
</svg>
