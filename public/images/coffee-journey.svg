<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-label="Путь кофе от вишни до чашки">
  <style>
    .bg{fill:#f6f4ee}
    .ink{fill:none;stroke:#2a2622;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
    .fillink{fill:#2a2622}
    .acc{fill:none;stroke:#b06a43;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
    .accf{fill:#b06a43}
    .lbl{fill:#5b524a;font-family:Georgia,'Times New Roman',serif;font-size:17px;text-anchor:middle}
    .arr{stroke:#b9a58f;stroke-width:2;stroke-linecap:round}
  </style>
  <rect class="bg" x="0" y="0" width="900" height="250" rx="16"/>

  <!-- arrows -->
  <g class="arr">
    <line x1="128" y1="95" x2="172" y2="95"/><polyline points="164,90 172,95 164,100" fill="none"/>
    <line x1="308" y1="95" x2="352" y2="95"/><polyline points="344,90 352,95 344,100" fill="none"/>
    <line x1="488" y1="95" x2="532" y2="95"/><polyline points="524,90 532,95 524,100" fill="none"/>
    <line x1="668" y1="95" x2="712" y2="95"/><polyline points="704,90 712,95 704,100" fill="none"/>
  </g>

  <!-- 1. Вишня -->
  <g transform="translate(90,95)">
    <circle class="accf" cx="0" cy="6" r="22"/>
    <path class="acc" d="M0,-16 C6,-26 16,-28 20,-22" />
    <path class="ink" d="M6,-15 q6,-8 14,-6" stroke="#2a2622"/>
    <ellipse cx="-6" cy="0" rx="4" ry="6" fill="#fff" opacity="0.5"/>
  </g>
  <text class="lbl" x="90" y="160">вишня</text>

  <!-- 2. Зерно -->
  <g transform="translate(270,95)">
    <ellipse class="ink" cx="-10" cy="6" rx="12" ry="18" transform="rotate(-18 -10 6)"/>
    <path class="ink" d="M-10,-9 C-14,-2 -14,10 -10,20" transform="rotate(-18 -10 6)"/>
    <ellipse class="ink" cx="12" cy="6" rx="12" ry="18" transform="rotate(18 12 6)"/>
    <path class="ink" d="M12,-9 C8,-2 8,10 12,20" transform="rotate(18 12 6)"/>
  </g>
  <text class="lbl" x="270" y="160">зерно</text>

  <!-- 3. Сушка -->
  <g transform="translate(450,95)">
    <circle class="acc" cx="0" cy="-14" r="10"/>
    <g class="acc"><line x1="0" y1="-32" x2="0" y2="-28"/><line x1="16" y1="-14" x2="12" y2="-14"/><line x1="-16" y1="-14" x2="-12" y2="-14"/><line x1="12" y1="-26" x2="9" y2="-23"/><line x1="-12" y1="-26" x2="-9" y2="-23"/></g>
    <rect class="ink" x="-24" y="6" width="48" height="16" rx="3"/>
    <g class="fillink"><circle cx="-14" cy="14" r="2"/><circle cx="-4" cy="14" r="2"/><circle cx="6" cy="14" r="2"/><circle cx="16" cy="14" r="2"/></g>
  </g>
  <text class="lbl" x="450" y="160">сушка</text>

  <!-- 4. Обжарка -->
  <g transform="translate(630,95)">
    <circle class="ink" cx="0" cy="4" r="22"/>
    <line class="ink" x1="-22" y1="4" x2="22" y2="4"/>
    <circle class="fillink" cx="0" cy="4" r="3"/>
    <g class="acc"><path d="M-6,-24 q4,-6 0,-12"/><path d="M6,-24 q4,-6 0,-12"/></g>
  </g>
  <text class="lbl" x="630" y="160">обжарка</text>

  <!-- 5. Чашка -->
  <g transform="translate(810,95)">
    <path class="ink" d="M-20,-2 h34 v12 a17,17 0 0 1 -34,0 z"/>
    <path class="ink" d="M14,2 a10,10 0 0 1 0,16"/>
    <g class="acc"><path d="M-8,-14 q5,-6 0,-12"/><path d="M2,-14 q5,-6 0,-12"/></g>
  </g>
  <text class="lbl" x="810" y="160">чашка</text>
</svg>
